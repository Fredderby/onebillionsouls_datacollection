services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-souls_root_password}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "3003"
      # Defaults to the bundled db service. Set COMPOSE_DB_HOST/COMPOSE_DB_PORT
      # in Dokploy to point the app at an external MySQL instead.
      DB_HOST: ${COMPOSE_DB_HOST:-db}
      DB_PORT: ${COMPOSE_DB_PORT:-3306}
    ports:
      - "3003:3003"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
